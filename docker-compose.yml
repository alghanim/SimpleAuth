# =============================================================================
# SimpleAuth — Docker Compose
# =============================================================================
#
# Quick start:
#   cp .env.example .env    # Edit with your values
#   docker compose up -d
#
# Full stack with nginx TLS termination (RECOMMENDED for production):
#   1. Place TLS cert/key in deploy/nginx/certs/
#   2. In .env set AUTH_TLS_DISABLED=true  (nginx terminates TLS; the app is
#      reachable ONLY on the internal network, so plaintext there is fine)
#   3. docker compose --profile full up -d
#
# With your app:
#   docker compose --profile full --profile app up -d
#
# SECURITY DEFAULTS:
#   - The app port is NOT published to the host (internal network only).
#   - TLS is ENABLED by default (AUTH_TLS_DISABLED=false) so a bare run is HTTPS.
#     Set AUTH_TLS_DISABLED=true ONLY under the nginx `full` profile (above) or
#     another TLS-terminating proxy on a trusted network.
#
# All config comes from .env — see .env.example for all options.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SimpleAuth — core authentication service
  # ---------------------------------------------------------------------------
  simpleauth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-latest}"
    image: simpleauth:latest
    container_name: simpleauth
    restart: unless-stopped

    environment:
      # All values come from .env file (see .env.example)
      AUTH_ADMIN_KEY: "${AUTH_ADMIN_KEY:-}"
      AUTH_HOSTNAME: "${AUTH_HOSTNAME:-localhost}"
      AUTH_DEPLOYMENT_NAME: "${AUTH_DEPLOYMENT_NAME:-sauth}"
      AUTH_PORT: "${AUTH_PORT:-8080}"
      AUTH_HTTP_PORT: "${AUTH_HTTP_PORT:-}"
      # TLS is ENABLED by default (the app serves its own HTTPS / auto self-signed).
      # Only set AUTH_TLS_DISABLED=true when this container sits behind a TLS-
      # terminating reverse proxy (the bundled nginx `full` profile, Traefik,
      # Caddy, ...). Disabling TLS while host-exposing the port serves all
      # credentials, tokens and the admin key in cleartext — do not do that.
      AUTH_TLS_DISABLED: "${AUTH_TLS_DISABLED:-false}"
      AUTH_TRUSTED_PROXIES: "${AUTH_TRUSTED_PROXIES:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}"
      AUTH_JWT_ISSUER: "${AUTH_JWT_ISSUER:-simpleauth}"
      AUTH_JWT_ACCESS_TTL: "${AUTH_JWT_ACCESS_TTL:-8h}"
      AUTH_JWT_REFRESH_TTL: "${AUTH_JWT_REFRESH_TTL:-720h}"
      AUTH_IMPERSONATE_TTL: "${AUTH_IMPERSONATE_TTL:-1h}"
      AUTH_CLIENT_ID: "${AUTH_CLIENT_ID:-simpleauth}"
      AUTH_CLIENT_SECRET: "${AUTH_CLIENT_SECRET:-}"
      AUTH_REDIRECT_URIS: "${AUTH_REDIRECT_URIS:-}"
      AUTH_RATE_LIMIT_MAX: "${AUTH_RATE_LIMIT_MAX:-10}"
      AUTH_RATE_LIMIT_WINDOW: "${AUTH_RATE_LIMIT_WINDOW:-1m}"
      AUTH_AUDIT_RETENTION: "${AUTH_AUDIT_RETENTION:-2160h}"
      AUTH_CORS_ORIGINS: "${AUTH_CORS_ORIGINS:-}"
      AUTH_DEFAULT_ROLES: "${AUTH_DEFAULT_ROLES:-}"
      AUTH_BASE_PATH: "${AUTH_BASE_PATH:-}"
      AUTH_DATA_DIR: "${AUTH_DATA_DIR:-/data}"
      # Kerberos (uncomment if needed)
      # AUTH_KRB5_KEYTAB: "/data/krb5.keytab"
      # AUTH_KRB5_REALM: "${AUTH_KRB5_REALM:-}"
      # TLS cert/key (optional — auto self-signed when empty)
      # AUTH_TLS_CERT: "/data/tls.crt"
      # AUTH_TLS_KEY: "/data/tls.key"

    volumes:
      - simpleauth-data:/data

    # By default the app port is NOT published to the host. It is only reachable
    # on the internal `simpleauth-net` network (e.g. by the nginx `full` profile),
    # so the plaintext/backend port can never be hit directly, bypassing nginx
    # TLS termination, security headers and rate limiting.
    expose:
      - "${AUTH_PORT:-8080}"

    # To run bare SimpleAuth (no nginx) and reach it from the host, publish the
    # port bound to LOOPBACK ONLY and keep TLS enabled (AUTH_TLS_DISABLED=false).
    # Never bind 0.0.0.0 with TLS disabled.
    # ports:
    #   - "127.0.0.1:${SIMPLEAUTH_PORT:-8080}:${AUTH_PORT:-8080}"

    networks:
      - simpleauth-net

    # ----- Container hardening -------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Nginx — reverse proxy with production TLS termination
  # Activate with: docker compose --profile full up -d
  # Terminates TLS on host 80/443 and proxies to simpleauth over the internal
  # network. Set AUTH_TLS_DISABLED=true in .env so the backend speaks plain HTTP
  # internally; it is never exposed to the host, so only nginx can reach it.
  # Runs unprivileged (non-root) on container ports 8080/8443.
  # ---------------------------------------------------------------------------
  nginx:
    profiles: ["full"]
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    container_name: simpleauth-nginx
    restart: unless-stopped
    depends_on:
      simpleauth:
        condition: service_healthy

    # nginx runs unprivileged (non-root) and listens on 8080/8443 inside the
    # container; the host's privileged 80/443 are mapped to those high ports.
    ports:
      - "80:8080"
      - "443:8443"

    volumes:
      - ./deploy/nginx/certs/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ./deploy/nginx/certs/privkey.pem:/etc/nginx/ssl/privkey.pem:ro

    networks:
      - simpleauth-net

    # ----- Container hardening -------------------------------------------------
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Example: Your app — shares AUTH_ADMIN_KEY from the same .env file
  # Activate with: docker compose --profile app up -d
  # ---------------------------------------------------------------------------
  # myapp:
  #   profiles: ["app"]
  #   image: your-app:latest
  #   container_name: myapp
  #   restart: unless-stopped
  #   environment:
  #     # Same AUTH_ADMIN_KEY from .env — no duplication needed
  #     SIMPLEAUTH_ADMIN_KEY: "${AUTH_ADMIN_KEY:-}"
  #     SIMPLEAUTH_URL: "http://simpleauth:${AUTH_PORT:-8080}"
  #     # Or if your app uses different env var names:
  #     # AUTH_SERVER: "http://simpleauth:8080"
  #     # AUTH_KEY: "${AUTH_ADMIN_KEY:-}"
  #   networks:
  #     - simpleauth-net
  #   depends_on:
  #     - simpleauth

volumes:
  simpleauth-data:
    driver: local

networks:
  simpleauth-net:
    driver: bridge
