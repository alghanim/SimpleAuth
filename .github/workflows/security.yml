# =============================================================================
# SimpleAuth — Security: dependency vulnerability scanning
# =============================================================================
# Runs govulncheck (the official Go vulnerability scanner) against the server
# and the Go SDK. SimpleAuth is an auth server, so a known-vulnerable dependency
# is a security bug — this gate is intentionally blocking. Also runs weekly so a
# newly-disclosed CVE in a pinned dependency surfaces even without a code change.
# =============================================================================

name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default to no permissions; the scan job opts into the least it needs.
permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0 # pinned: v1.8.0+ needs Go 1.26; bump with go.mod

      - name: Scan server module
        run: govulncheck ./...

      - name: Scan Go SDK module
        working-directory: sdk/go
        run: govulncheck ./...
