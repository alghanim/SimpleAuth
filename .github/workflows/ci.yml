# =============================================================================
# SimpleAuth — CI: Build & Test
# =============================================================================
# Runs on every push and pull request. Validates that the Go code compiles,
# tests pass, and the Docker image builds successfully.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Default to no permissions; each job opts into the least it needs.
permissions: {}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (race detector)
        run: go test -race ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image
        run: docker build -t simpleauth:ci .
